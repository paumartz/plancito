<title>Plancito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: una sola columna tipo app móvil, centrada en desktop. Stickers pastel sobre papel cálido, línea de tinta hecha a mano. */
:root{
  --paper:#FBF6EE; --card:#FFFFFF; --ink:#2A1F1D; --ink-2:#74665F; --line:#EADFD1;
  --tomato:#E8573A; --pink:#F6B5C6; --sky:#BCD7EA; --peach:#F5BE92; --lime:#D7EEA4; --lilac:#D3C4F6;
  --on-pastel:#2A1F1D; --ok:#3E8E5A; --warn:#C7772A; --bad:#C8432B;
  --btn:#2A1F1D; --btn-fg:#FBF6EE;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1614; --card:#26201D; --ink:#F5ECE3; --ink-2:#B5A79E; --line:#3A302B;
  --tomato:#F06A4D; --btn:#F5ECE3; --btn-fg:#1B1614; --ok:#6CC28B; --warn:#E3A35B; --bad:#F07A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1614; --card:#26201D; --ink:#F5ECE3; --ink-2:#B5A79E; --line:#3A302B;
  --tomato:#F06A4D; --btn:#F5ECE3; --btn-fg:#1B1614; --ok:#6CC28B; --warn:#E3A35B; --bad:#F07A62; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--tomato);outline-offset:2px;border-radius:8px}
.shell{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
@media (min-width:640px){
  body{padding-block:24px}
  .shell{min-height:calc(100vh - 48px);border:1.5px solid var(--line);border-radius:34px;overflow:hidden;background:var(--paper)}
}
main{flex:1;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.05}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.back{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.pts{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 7px;border-radius:99px;background:var(--lime);color:var(--on-pastel);font-weight:700;font-size:13px}
.pts i{width:18px;height:18px;border-radius:50%;background:var(--on-pastel);color:var(--lime);display:grid;place-items:center;font-style:normal;font-size:11px}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.tight{padding:12px 14px;gap:8px}
.sticker{border-radius:24px 20px 26px 18px;padding:16px;color:var(--on-pastel);display:flex;flex-direction:column;gap:10px;position:relative}
.sticker .muted{color:color-mix(in srgb, var(--on-pastel) 68%, transparent)}
.bg-pink{background:var(--pink)}.bg-sky{background:var(--sky)}.bg-peach{background:var(--peach)}.bg-lime{background:var(--lime)}.bg-lilac{background:var(--lilac)}
.ticket{background:var(--card);border:2px dashed var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ticket .big{font-family:var(--f-display);font-size:23px;font-weight:800;line-height:1.1}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--btn);color:var(--btn-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:color-mix(in srgb, var(--ink) 8%, transparent);color:var(--ink)}
.btn.tomato{background:var(--tomato);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.sticker .btn.ghost{color:var(--on-pastel);border-color:color-mix(in srgb, var(--on-pastel) 30%, transparent)}
.sticker .btn{background:var(--on-pastel);color:#FBF6EE}
.sticker .btn.ghost{background:transparent;color:var(--on-pastel)}
.link{background:none;border:0;padding:0;color:var(--tomato);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb, var(--ink) 8%, transparent)}
.chip.ok{background:color-mix(in srgb, var(--ok) 18%, transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb, var(--warn) 20%, transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
.chip.pastel{background:var(--pink);color:var(--on-pastel)}
.sticker .chip{background:color-mix(in srgb, var(--on-pastel) 12%, transparent);color:var(--on-pastel)}

/* avatars */
.av{display:block;flex:none}
.avb{border-radius:50%;background:color-mix(in srgb, var(--ink) 6%, var(--card));display:grid;place-items:center;overflow:hidden;flex:none;border:1.5px solid var(--line)}
.avstack{display:flex}
.avstack .avb{margin-left:-10px;border:2px solid var(--card)}
.avstack .avb:first-child{margin-left:0}
.sticker .avstack .avb{border-color:transparent}

/* options / votes */
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.opt.mine{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb, var(--peach) 45%, transparent);z-index:0;transition:width .35s}
.opt > *:not(.bar){position:relative;z-index:1}
.opt .lbl{font-weight:700}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px}
.opt.mine .tick{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.by{font-family:var(--f-hand);font-size:18px;color:var(--tomato)}

.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .step{padding:5px 10px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700}
.flow .arrow{color:var(--ink-2);font-size:13px}
.flow .step.now{border-style:dashed;border-color:var(--ink);background:transparent}

.meter{height:8px;border-radius:99px;background:color-mix(in srgb, var(--ink) 9%, transparent);overflow:hidden}
.meter > span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.over > span{background:var(--bad)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:block}
.dots i.on{background:currentColor}

.list{display:flex;flex-direction:column}
.list > .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1.5px solid var(--line)}
.list > .li:first-child{border-top:0}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.tab{border:1.5px solid var(--line);background:var(--card);padding:8px 13px;border-radius:99px;font-weight:700;font-size:13.5px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:72px}
.check{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1.5px solid var(--line);border-radius:99px;font-size:13.5px;font-weight:500;background:var(--card)}
.check:has(input:checked){border-color:var(--ink);background:color-mix(in srgb, var(--ink) 7%, var(--card))}
.check input{accent-color:var(--tomato)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 8px;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick.on{border-color:var(--ink);background:color-mix(in srgb, var(--peach) 35%, var(--card))}

.alias{display:flex;align-items:center;gap:8px;background:color-mix(in srgb, var(--ink) 5%, var(--card));border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.alias span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bottom nav */
nav.bar{position:sticky;bottom:0;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));z-index:5}
nav.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);padding:4px 0}
nav.bar button.on{color:var(--ink)}
nav.bar svg{width:24px;height:24px}
nav.bar .plus{width:50px;height:50px;border-radius:18px 16px 19px 15px;background:var(--tomato);color:#fff;display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 18px -6px color-mix(in srgb, var(--tomato) 70%, transparent)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(30,20,16,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.opt .bar{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:min(380px, calc(100% - 32px));text-align:center}

.avpicker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avpicker button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700}
.avpicker button.on{border-color:var(--ink);background:color-mix(in srgb, var(--peach) 30%, var(--card))}
.hero-av{display:grid;place-items:center;padding:8px 0 0}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:700}
.badge .b{width:54px;height:54px;border-radius:20px 16px 22px 15px;display:grid;place-items:center}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--ink-2)}
.vchip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.vchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vchip .n{font-size:11.5px;min-width:18px;height:18px;border-radius:99px;display:inline-grid;place-items:center;background:color-mix(in srgb, currentColor 15%, transparent);padding:0 5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:color-mix(in srgb, var(--ink) 7%, transparent);padding:4px;border-radius:13px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-weight:700;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 0 var(--line)}
.slotgrid{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:5px}
.slotgrid .h{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center}
.slotgrid .d{font-weight:700;font-size:13.5px;display:flex;align-items:center;padding-right:2px;white-space:nowrap}
.slot{border:1.5px solid var(--line);border-radius:14px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:700;color:var(--ink);background:color-mix(in srgb, var(--peach) calc(var(--h) * 85%), var(--card))}
.slot.mine{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.slot.best{outline:2px dashed var(--tomato);outline-offset:2px}
.slot small{font-size:10px;font-weight:700;opacity:.75}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn,.slot,.vchip,.opt,.pick,.avpicker button{transition:transform .12s}
.btn:active,.slot:active,.vchip:active,.opt:active,.pick:active,.avpicker button:active{transform:scale(.94)}
.locked{position:relative}
.locked > svg{opacity:.4;filter:grayscale(.7)}
.lockb{position:absolute;top:4px;right:4px;font-size:10.5px;font-weight:800;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 6px}
.lvl{width:64px;height:64px;border-radius:22px 18px 24px 16px;background:var(--on-pastel);color:#FFD166;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;text-align:center}
.lvl b{display:block;font-size:26px}
.unl{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;text-align:center}
.unl.off svg{opacity:.35;filter:grayscale(.8)}
.unl .need{font-size:11px;color:var(--ink-2)}
.zbtn{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.zbtn.on{border-color:var(--ink);background:color-mix(in srgb, var(--peach) 35%, var(--card))}
.zbtn.locked{opacity:.6}
.zbtn .ico{font-family:var(--f-hand);font-size:24px;line-height:1;color:var(--tomato)}
.award{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px}
.award .who{font-weight:700;font-size:13px}
/* efectos */
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-9px,3px) rotate(-1deg)}20%{transform:translate(8px,-4px) rotate(1deg)}30%{transform:translate(-7px,-2px)}40%{transform:translate(7px,4px) rotate(-1deg)}50%{transform:translate(-6px,2px)}60%{transform:translate(5px,-3px)}70%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}90%{transform:translate(-2px,1px)}}
.shaking{animation:shake .5s linear 2}
.shaking.hard{animation:shake .38s linear 4}
.fx-ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));background:rgba(30,20,16,.38);animation:fadein .2s}
.fx-card{background:var(--paper);border-radius:28px;padding:24px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.fx-card .big{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
@keyframes popin{from{transform:scale(.55) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
.bzz{font-family:var(--f-hand);font-size:52px;color:var(--tomato);line-height:1;animation:wiggle .16s linear infinite alternate}
@keyframes wiggle{from{transform:rotate(-6deg)}to{transform:rotate(6deg) scale(1.06)}}
.buzz-av{display:flex;align-items:center;gap:6px;animation:wiggle .1s linear 14 alternate}
.bubble{background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:16px}
.stamp{font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--tomato);border:4px solid var(--tomato);border-radius:14px;padding:0 14px;transform:rotate(-8deg);animation:stamp .55s cubic-bezier(.2,1.8,.4,1) both .1s}
@keyframes stamp{from{transform:scale(2.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.bounce{display:inline-block;animation:bounce .9s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.starpop{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:55;pointer-events:none;text-align:center;animation:floatup 1.8s ease-out forwards;background:var(--paper);border:2px solid #E0A100;border-radius:20px;padding:8px 18px}
.starpop b{font-family:var(--f-display);font-size:34px;color:#C98A00;display:block;line-height:1.1}
.starpop span{font-size:13px;font-weight:700}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,24px) scale(.6)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.pts.bump{animation:bumpk .55s}
@keyframes bumpk{40%{transform:scale(1.35) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.shaking,.fx-card,.stamp,.bounce,.bzz,.buzz-av,.pts.bump{animation:none!important}.starpop{animation:fadein .2s}}
.stampx{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--c);border-radius:3px;flex:none;color:#5B1E1E;transform:rotate(-3deg)}
.stampx::before{content:"";position:absolute;inset:-4px;border:5px dotted var(--hole, var(--paper));border-radius:5px;pointer-events:none}
.stampx::after{content:"";position:absolute;inset:4px;border:1.5px solid rgba(91,30,30,.35);border-radius:2px;pointer-events:none}
.card .stampx, .ticket .stampx{--hole:var(--card)}
.stampx b{font-family:var(--f-hand);line-height:.85;font-weight:700}
.icopick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icopick button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px;display:grid;place-items:center}
.icopick button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.swatches button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.map{width:100%;height:auto;display:block;border-radius:16px;background:color-mix(in srgb, var(--sky) 25%, var(--card));border:1.5px solid var(--line)}
.place{display:flex;gap:10px;align-items:flex-start}
.place .pin{width:24px;height:24px;border-radius:50%;background:var(--tomato);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.idea{display:flex;gap:10px;align-items:flex-start}
.idea .poster{width:44px;height:58px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--f-hand);font-size:22px;color:var(--on-pastel)}
.pigdance{animation:pigdance .32s ease-in-out infinite alternate;transform-origin:50% 90%}

const LUGARES = [['casa','En casa','en casa'], ['afuera','Resto / bar','en un resto o bar'], ['aire','Al aire libre','en una plaza o parque']];
const lugaresFor = g => [...(g.spots || []).filter(x => x.type === 'resto').map(x => ['spot:' + x.name, 'En ' + x.name, 'en ' + x.name]), ...LUGARES];
const MENUS = {
  desayuno:[['medialunas','Café con medialunas'],['brunch','Brunch completo'],['tostadas','Tostadas y palta']],
  almuerzo:[['asado','Asado'],['pastas','Pastas'],['bowls','Bowls y ensaladas'],['cocinamos','¡Cocinamos!']],
  cafe:[['especialidad','Café de especialidad'],['mate','Mate y facturas'],['dulce','Algo dulce']],
  cena:[['pizza','Pizza'],['burgers','Hamburguesas'],['sushi','Sushi'],['picada','Picada y vinito'],['cocinamos','¡Cocinamos!']],
  birras:[['artesanal','Cerveza artesanal'],['tragos','Tragos'],['vinito','Vinito']],
};
const menusFor = (g, plan) => [...(MENUS[plan] || []), ...(['almuerzo','cena'].includes(plan) ? (g.spots || []).filter(x => x.type === 'delivery').map(x => ['deli:' + x.name, 'Pedimos a ' + x.name]) : [])];
const COCINA = [['pastas','Pastas caseras'],['tacos','Tacos'],['risotto','Risotto'],['empanadas','Empanadas'],['pizza','Pizza casera']];
const ORDER = ['dia','momento','hora','plan','lugar','host','menu','cocina'];
const SHORT = { cuando:'Cuándo', donde:'Qué y dónde' };
const slotId = (d, m) => d + '|' + m;
function dayOptions(n=5){
  const out = []; const d = new Date(TODAY);
  while (out.length < n){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w===5 || w===6 || w===0){
    const s = iso(d); out.push({ id:s, date:s, label:cap(fmtD(s)), phrase:'el ' + fmtD(s,{weekday:'long', day:'numeric'}) }); } }
  return out;
}
function attendees(g, p){ const out = new Set((p.out||[]).map(o => o.who)); return g.members.filter(m => !out.has(m)); }
function emptyBallot(round){ return round === 'cuando' ? {slots:[], done:false} : {plan:[], lugar:[], host:false, menu:[], cocina:[], hora:[], done:false}; }
function leadPlan(g, p){ const ids = planesFor(g, p.answers.momento.id), w = best(p, 'plan', ids);
  return votersFor(p, 'plan', w).length ? w : (p.proposed && ids.includes(p.proposed.plan) ? p.proposed.plan : ids[0]); }
function myBallot(p, who=S.me){ const b = p.ballots[p.round]; if (!b[who]) b[who] = emptyBallot(p.round); return b[who]; }
function votersFor(p, field, id){ return Object.entries(p.ballots[p.round] || {}).filter(([w,b]) => (b[field] || []).includes(id)).map(([w]) => w); }
function best(p, field, ids){ let bi = ids[0], bn = -1; ids.forEach(id => { const n = votersFor(p, field, id).length; if (n > bn){ bn = n; bi = id; } }); return bi; }
function simBallot(g, p, who, r){
  const prop = p.proposed || {};
  const pick = (arr, k) => { const xs = arr.map(x => Array.isArray(x) ? x[0] : x), s = new Set(), kk = Math.min(k, xs.length); while (s.size < kk) s.add(xs[Math.floor(r()*xs.length)]); return [...s]; };
  if (p.round === 'cuando'){
    const days = dayOptions().map(d => d.id), slots = new Set();
    if (who === p.createdBy && prop.dia && prop.momento) slots.add(slotId(prop.dia, prop.momento));
    days.forEach(d => MOMENTOS.forEach(mo => { const base = !prop.momento ? .4 : prop.momento === mo.id ? .6 : .12; if (r() < base) slots.add(slotId(d, mo.id)); }));
    if (prop.dia && prop.momento && r() < .7) slots.add(slotId(prop.dia, prop.momento));
    if (!slots.size) slots.add(slotId(days[1], prop.momento || 'noche'));
    return {slots:[...slots], done:true};
  }
  const mom = p.answers.momento.id, opts = planesFor(g, mom);
  const plan = prop.plan && opts.includes(prop.plan) && r() < .75 ? [prop.plan] : pick(opts.slice(0, 4), 1 + Math.floor(r()*2));
  const food = plan.filter(k => PLANES[k].food), menuPool = food.flatMap(k => menusFor(g, k));
  const menu = !menuPool.length ? [] : r() < .25 ? ['impro'] : pick(menuPool, 2);
  const lugar = food.length ? pick(lugaresFor(g), 1 + Math.floor(r()*2)) : [];
  return { plan, lugar, host:false, menu, cocina: menu.includes('cocinamos') ? pick(COCINA, 2) : [], hora: pick(MOM(mom).horas, 2), done:true };
}
function openRound(g, p, round, st=S){
  p.round = round; p.ballots = p.ballots || {}; p.ballots[round] = {};
  const r = rng(p.id + round), others = attendees(g,p).filter(m => m !== st.me);
  p.pending = others.length > 1 ? others[Math.floor(r()*others.length)] : null;
  const vol = round === 'donde' && others.length ? others[Math.floor(r()*others.length)] : null;
  others.forEach(m => { if (m === p.pending) return; const b = simBallot(g, p, m, r);
    if (m === vol && r() < .75 && b.lugar.length){ b.host = true; if (!b.lugar.includes('casa')) b.lugar.push('casa'); } p.ballots[round][m] = b; });
  if (round === 'donde' && p.createdBy === st.me && p.proposed && p.proposed.plan) p.ballots.donde[st.me] = {...emptyBallot('donde'), plan:[p.proposed.plan]};
  else if (round === 'donde' && p.createdBy === st.me && p.proposed && p.proposed.lugar) p.ballots.donde[st.me] = {...emptyBallot('donde'), lugar:[p.proposed.lugar]};
}
function closeRound(g, p){
  if (p.round === 'cuando'){
    const days = dayOptions(), ids = days.flatMap(d => MOMENTOS.map(m => slotId(d.id, m.id)));
    const [d, m] = best(p, 'slots', ids).split('|'), mo = MOM(m);
    p.answers.dia = {...days.find(x => x.id === d)}; p.answers.momento = {id:mo.id, label:mo.label, phrase:mo.en};
    openRound(g, p, 'donde'); return;
  }
  const mom = p.answers.momento.id, b = p.ballots.donde;
  const planId = leadPlan(g, p), PL = PLANES[planId]; p.answers.plan = {id:planId, label:PL.l, phrase:PL.ph};
  const pickOr = (field, ids) => { const w = best(p, field, ids); return votersFor(p, field, w).length ? w : 'impro'; };
  if (PL.food){
    const vols = Object.entries(b).filter(([w,x]) => x.host).map(([w]) => w), LS = lugaresFor(g);
    let lugar = pickOr('lugar', [...LS.map(x => x[0]), 'impro']);
    if (lugar === 'casa' && !vols.length) lugar = pickOr('lugar', [...LS.map(x => x[0]).filter(x => x !== 'casa'), 'impro']);
    const L = LS.find(x => x[0] === lugar) || ['impro','Lo vemos en el momento',''];
    p.answers.lugar = {id:L[0], label:L[1], phrase:L[2]};
    if (lugar === 'casa'){ const h = vols[0]; p.answers.host = {id:h, label:'Lo de ' + nick(h), phrase:'en lo de ' + nick(h)}; }
    const MS = menusFor(g, planId), menuIds = [...MS.map(x => x[0]).filter(x => lugar === 'casa' || (x !== 'cocinamos' && !x.startsWith('deli:'))), 'impro'];
    const mn = pickOr('menu', menuIds), M = MS.find(x => x[0] === mn) || ['impro','Improvisamos']; p.answers.menu = {id:mn, label:M[1], phrase:M[1].toLowerCase()};
    if (mn === 'cocinamos'){ const c = best(p, 'cocina', COCINA.map(x => x[0])), C = COCINA.find(x => x[0] === c); p.answers.cocina = {id:c, label:C[1], phrase:C[1].toLowerCase()}; }
  }
  const h = best(p, 'hora', MOM(mom).horas); p.answers.hora = {id:h, label:h, phrase:h};
  p.status = 'definido'; p.date = p.answers.dia.date; p.round = null; p.reminders = ['3d','1d'];
}
function planWhere(a){ if (!a.lugar) return ''; if (a.lugar.id === 'casa') return a.host ? a.host.phrase : 'en casa'; return a.lugar.phrase; }
function planTitle(p){
  const a = p.answers;

  if (!a.plan) return `Plancito ${MOM(a.momento.id).en}`;
  const where = a.host ? 'en lo de ' + a.host.label.replace('Lo de ','') : (a.lugar ? (({aire:'al aire libre', afuera:'afuera'})[a.lugar.id] || (a.lugar.id.startsWith('spot:') ? a.lugar.phrase : '')) : '');
  return `${a.plan.label} ${where}`.trim();
}
function planSentence(p){
  const a = p.answers; if (!a.dia || !a.hora) return '';
  let s = `Nos juntamos ${a.dia.phrase} a las ${a.hora.label} ${planWhere(a)} ${a.plan.phrase}.`.replace(/\s+/g,' ');
  if (a.lugar && a.lugar.id === 'impro') s += ' El lugar lo vemos en el momento.';
  if (a.menu) s += a.menu.id.startsWith('deli:') ? ` ${a.menu.label}.` : a.menu.id === 'cocinamos' ? ` Cocinamos ${a.cocina ? a.cocina.label.toLowerCase() : 'algo rico'}.` : ` Menú: ${a.menu.label.toLowerCase()}.`;

}
function gcalUrl(g, p){

/* gastos estilo splitwise */
function balances(p){ const b = {}; p.expenses.forEach(e => { const sh = e.amount / e.involved.length; b[e.paidBy] = (b[e.paidBy]||0) + e.amount; e.involved.forEach(x => b[x] = (b[x]||0) - sh); }); return b; }
function settle(p){
  const b = balances(p), cred = [], deb = [];
  Object.entries(b).forEach(([k,v]) => { if (v > .5) cred.push([k,v]); else if (v < -.5) deb.push([k,-v]); });
  cred.sort((x,y) => y[1]-x[1]); deb.sort((x,y) => y[1]-x[1]);
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cred.length){ const amt = Math.min(deb[i][1], cred[j][1]); out.push({from:deb[i][0], to:cred[j][0], amt});
    deb[i][1] -= amt; cred[j][1] -= amt; if (deb[i][1] < .5) i++; if (cred[j][1] < .5) j++; }
  return out;
}

function vRanking(g){

  const el = document.createElement('div'); el.className = 'starpop'; el.setAttribute('role','status');
  el.innerHTML = `<b>+${n} ★</b><span>${esc(label)}</span>`; document.body.appendChild(el); setTimeout(() => el.remove(), 1900);
  particles('estrellas', {n:16, dur:1600});
  document.querySelectorAll('.pts').forEach(x => { x.classList.remove('bump'); void x.offsetWidth; x.classList.add('bump'); });
}
function levelUp(a, b){
  const up = levelOf(b) > levelOf(a), un = unlocksBetween(a, b);
  chime(); particles('estrellas', {dur:2800}); setTimeout(() => particles('confeti', {n:70, dur:2200}), 300);
  overlay(`<div class="bzz" style="color:#E0A100">★</div><span class="eyebrow">${up ? '¡Subiste de nivel!' : '¡Desbloqueaste algo nuevo!'}</span>
    ${up ? `<div class="big">${LEVELS[levelOf(b)][1]}</div>` : ''}
    ${un.length ? `<div class="row wrap" style="justify-content:center">${un.map(([c, v]) => `<div class="unl" style="min-width:96px"><span class="hand" style="color:var(--tomato);height:64px;display:grid;place-items:center">${zIcon(v, 56)}</span><span>${unlockLbl(c, v)}</span></div>`).join('')}</div>` : ''}
    <div class="grid2" style="width:100%"><button class="btn ghost" data-a="fxClose">Después</button>${un.length ? `<button class="btn tomato" data-a="tryUnlock" data-k="${un[0][0]}" data-v="${un[0][1]}">Probarlo</button>` : '<button class="btn" data-a="fxClose">¡Genial!</button>'}</div>`);
}

let toastT;
function toast(msg){
  let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}
function copy(text, msg='Copiado'){
  try { navigator.clipboard.writeText(text).then(() => toast(msg), () => toast('No se pudo copiar: ' + text)); } catch(e){ toast('No se pudo copiar: ' + text); }
}
const val = id => (document.getElementById(id) || {}).value || '';
const go = (view, extra={}) => { Object.assign(UI, {view, modal:null, challenge:false}, extra); render(); window.scrollTo(0,0); };
const commit = () => { save(); render(); };
const curPlan = () => G(UI.gid).plans.find(x => x.id === UI.pid);
function finishRound(g, p){ closeRound(g, p); commit(); window.scrollTo(0,0);
  if (p.status === 'definido') celebratePlan(g, p);
  else { toast(`Quedó ${p.answers.dia.label} · ${p.answers.momento.label}. Ahora, qué hacemos.`); particles('confeti', {n:60, dur:1800}); } }
let simT;
function afterReady(){
  commit();
  const g = G(UI.gid), p = curPlan(), round = p.round;
  clearTimeout(simT);
  simT = setTimeout(() => {
    if (p.round !== round || p.status !== 'votando') return;
    const pend = p.pending;
    if (pend && !(p.ballots[round][pend] && p.ballots[round][pend].done)){ p.ballots[round][pend] = simBallot(g, p, pend, rng(p.id + round + 'late')); toast(`${nick(pend)} acaba de responder`); commit(); }
    if (attendees(g,p).every(x => p.ballots[round][x] && p.ballots[round][x].done)) setTimeout(() => { if (p.round === round) finishRound(g, p); }, 1300);
  }, 1500);
}

/* =====================  acciones  ===================== */
const A = {
  go: d => go(d.v === 'group' ? 'group' : d.v),
  openGroup: d => go('group', {gid:d.g, tab:'plancitos'}),
  openPlan: d => go('plan', {gid:d.g, pid:d.p}),
  openIdeas: d => { go('group', {gid:d.g, tab:'plancitos', idea:d.p}); setTimeout(() => { const t = [...document.querySelectorAll('h2')].find(h => h.textContent === 'Ideas para ustedes'); if (t) t.scrollIntoView({behavior:'smooth'}); }, 50); },
  openRegalito: d => go('group', {gid:d.g, tab:'regalito'}),
  tab: d => { UI.tab = d.v; render(); },
  modal: d => { UI.modal = d.v; UI.giftPrefill = d.t || ''; render(); },
  close: () => { UI.modal = null; render(); },
  closeBg: (d, e) => { if (e.target.classList.contains('overlay')){ UI.modal = null; render(); } },
  propose: d => { const pl = d.v && PLANES[d.v] ? d.v : null; UI.prop = { gid: d.g || UI.gid || S.groups[0].id, vibe:'vago', momento: pl ? PLANES[pl].m[PLANES[pl].m.length-1] : 'noche', plan:pl, dia:null, lugar:null, created:null }; UI.modal = 'propose'; render(); },
  pset: d => { if (d.k === 'plan' && UI.prop.plan === d.v) UI.prop.plan = null; else UI.prop[d.k] = d.v;
    if (d.k === 'momento' && UI.prop.plan && !PLANES[UI.prop.plan].m.includes(d.v)) UI.prop.plan = null; render(); },
  createPlan: () => {
    const P = UI.prop, g = G(P.gid);
    if (activePlan(g)){ toast(`${g.name} ya tiene un plancito en votación`); return; }
    const proposed = {};
    if (P.vibe !== 'nada'){ proposed.momento = P.momento; if (P.plan) proposed.plan = P.plan; }
    if (P.vibe === 'concreto' && P.dia) proposed.dia = P.dia;
    const p = { id:'p' + Date.now().toString(36), status:'votando', createdBy:S.me, createdAt:iso(TODAY), proposed, answers:{}, ballots:{}, out:[], roles:null, expenses:[], paid:{} };
    g.plans.push(p); openRound(g, p, 'cuando');
    if (proposed.dia && proposed.momento) p.ballots.cuando[S.me] = {slots:[slotId(proposed.dia, proposed.momento)], done:true};
    P.created = p.id; commit();
  },
  share: d => { const g = G(UI.gid), p = g.plans.find(x => x.id === d.p); copy(`¡Quedó el plancito! ${planSentence(p)} https://${link(p)}`, 'Copiado: pegalo en el grupo'); },
  slot: d => { const b = myBallot(curPlan()), i = b.slots.indexOf(d.o); i > -1 ? b.slots.splice(i,1) : b.slots.push(d.o); commit(); },
  pick: d => { const arr = myBallot(curPlan())[d.k], i = arr.indexOf(d.o); i > -1 ? arr.splice(i,1) : arr.push(d.o); commit(); },
  hostToggle: () => { const b = myBallot(curPlan()); b.host = !b.host; if (b.host && !b.lugar.includes('casa')) b.lugar.push('casa'); commit(); },
  acceptProp: () => { const p = curPlan(), b = myBallot(p), id = slotId(p.proposed.dia, p.proposed.momento); if (!b.slots.includes(id)) b.slots.push(id); b.done = true; toast('Listo, te sumaste'); afterReady(); },
  ready: () => { const p = curPlan(), b = myBallot(p);
    if (p.round === 'cuando' && !b.slots.length){ toast('Marcá al menos un horario'); return; }
    b.done = true; toast('¡Listo! Te avisamos cuando se defina'); afterReady(); },
  closeNow: () => finishRound(G(UI.gid), curPlan()),
  rem: d => { const p = curPlan(); p.reminders = p.reminders || []; const i = p.reminders.indexOf(d.v); i > -1 ? p.reminders.splice(i,1) : p.reminders.push(d.v); toast(i > -1 ? 'Recordatorio quitado' : 'Te vamos a avisar'); commit(); },
  nudge: () => toast('Les mandamos un recordatorio'),
  goOut: () => { const g = G(UI.gid), p = g.plans.find(x => x.id === UI.pid); p.out.push({who:S.me, why:val('outWhy').trim()}); UI.modal = null; toast('Te bajaste. Le avisamos al grupo.'); commit(); },
  rejoin: () => { const g = G(UI.gid), p = g.plans.find(x => x.id === UI.pid); p.out = p.out.filter(o => o.who !== S.me); toast('¡Volviste!'); commit(); },
  markDone: () => {
    const g = G(UI.gid), p = g.plans.find(x => x.id === UI.pid);
    const pick = k => [...document.querySelectorAll(`input[name="r_${k}"]:checked`)].map(x => x.value);
    p.roles = { host:pick('host'), cocina:pick('cocina'), tarjeta:pick('tarjeta'), picada:pick('picada'), iniciativa:[p.createdBy] };
    Object.entries(p.roles).forEach(([k, ids]) => ids.forEach(id => addPoints(id, k, g.id)));
    p.status = 'realizado'; if (p.date > iso(TODAY)) p.date = iso(TODAY); g.lastPlan = p.date; UI.modal = null;
    toast('¡Plancito realizado! Puntos repartidos'); commit();
  },
  addExp: () => {
    const g = G(UI.gid), p = g.plans.find(x => x.id === UI.pid);
    const desc = val('exDesc').trim(), amt = Number(val('exAmt').replace(/[^\d]/g,'')), by = val('exBy');
    const inv = [...document.querySelectorAll('input[name="exInv"]:checked')].map(x => x.value);
    if (!desc || !amt){ toast('Poné qué fue y cuánto salió'); return; }
    if (!inv.length){ toast('Elegí al menos una persona'); return; }
    p.expenses.push({id:'e'+Date.now(), desc, amount:amt, paidBy:by, involved:inv}); toast('Gasto agregado'); commit();
  },
  markPaid: d => { const g = G(UI.gid), p = g.plans.find(x => x.id === UI.pid); p.paid[d.k] = true; if (d.k.startsWith(S.me + '>')) addPoints(S.me, 'pago', g.id); toast('Marcado como pagado'); commit(); },
  copy: d => copy(d.t),
  saveGoal: () => { const g = G(UI.gid); g.goal = {n:Number(val('goalN')), per:val('goalPer')}; UI.modal = null; commit(); },
  toggleReg: () => { const g = G(UI.gid); g.regalitoOn = !g.regalitoOn;
    if (g.regalitoOn && !g.regalito){ const others = g.members.filter(m => m !== S.me), next = others.sort((a,b) => nextBday(S.people[a].birthday) - nextBday(S.people[b].birthday))[0];
      g.regalito = { bday:next, owner:g.members.find(m => m !== next), contact:g.members.find(m => m !== next), status:'votando', budget:{amount:60000, cur:'ARS', since:iso(TODAY), mode:'ars'}, infl:null, gifts:[], chosen:null, cost:0, paid:[] }; }
    toast(g.regalitoOn ? 'Regalito activado' : 'Regalito apagado'); commit(); },
  bmode: d => { const g = G(UI.gid), r = g.regalito, rate = g.usdRate || 1450; if (r.budget.mode === d.v) return;
    r.budget.amount = d.v === 'usd' ? Math.round(r.budget.amount / rate) : Math.round(r.budget.amount * rate / 1000) * 1000;
    r.budget.cur = d.v === 'usd' ? 'USD' : 'ARS'; r.budget.mode = d.v; r.budget.since = iso(TODAY);
    toast(d.v === 'usd' ? 'Presupuesto en dólares. Le avisamos al grupo' : 'Presupuesto en pesos, ajustado por inflación'); commit(); },
  ownMe: () => { G(UI.gid).regalito.owner = S.me; toast('Ahora te encargás vos del regalo'); commit(); },
  infl: d => { const g = G(UI.gid), r = g.regalito; r.infl[d.v].push(S.me);
    if (r.infl.yes.length >= need(g)){ r.budget = {amount:r.infl.amount, cur:r.budget.cur, since:iso(TODAY)}; r.infl = null; toast('Presupuesto actualizado por mayoría'); }
    else if (r.infl.no.length >= need(g)){ r.infl = null; toast('Se queda el presupuesto anterior'); } commit(); },
  gvote: d => { const g = G(UI.gid), r = g.regalito, x = r.gifts.find(y => y.id === d.o), i = x.votes.indexOf(S.me);
    i > -1 ? x.votes.splice(i,1) : x.votes.push(S.me);
    if (x.votes.length >= need(g)){ r.status = 'aprobado'; r.chosen = x.id; toast(`Aprobado por mayoría: ${x.title}`); } commit(); },
  addGift: () => { const g = G(UI.gid), t = val('gfTitle').trim(), pr = Number(val('gfPrice').replace(/[^\d]/g,''));
    if (!t || !pr){ toast('Completá qué y cuánto'); return; }
    if (g.regalito.status !== 'votando'){ toast('Ya hay un regalo aprobado'); return; }
    g.regalito.gifts.push({id:'r'+Date.now(), title:t, price:pr, by:S.me, votes:[S.me], wish:S.people[g.regalito.bday].wishlist.includes(t)}); UI.modal = null; commit(); },
  confirmBuy: () => { const g = G(UI.gid), r = g.regalito; r.cost = Number(val('buyPrice').replace(/[^\d]/g,'')) || r.gifts.find(x=>x.id===r.chosen).price; r.status = 'comprado'; r.paid = [r.owner]; UI.modal = null; toast('Le avisamos a todos cuánto le toca'); commit(); },
  simBuy: () => { const g = G(UI.gid), r = g.regalito; const c = r.gifts.find(x=>x.id===r.chosen); r.cost = c.price; r.status = 'comprado'; r.paid = [r.owner]; toast(`${nick(r.owner)} avisó que lo compró`); commit(); },
  delivered: () => { const g = G(UI.gid), r = g.regalito; r.status = 'entregado'; addPoints(r.owner, 'regalo', g.id);
    g.history.push({to:r.bday, gift:r.gifts.find(x=>x.id===r.chosen).title, spend:r.cost, date:iso(TODAY), owner:r.owner}); toast('¡Regalo entregado! Quedó en el historial'); commit(); },
  gpay: () => { const g = G(UI.gid); g.regalito.paid.push(S.me); addPoints(S.me, 'pago', g.id); toast('Pagado. Todos ven que ya pusiste'); commit(); },
  remind: d => toast(`Le mandamos un recordatorio a ${nick(d.v)}`),
  createGroup: () => { const name = val('ngName').trim(); if (!name){ toast('Ponele un nombre'); return; }
    const [n, per] = val('ngGoal').split('-'), id = 'g' + Date.now().toString(36);
    S.groups.push({id, name, kind:val('ngKind'), stamp:{icon:['estrella','sol','copa','pelota'][S.groups.length % 4], color:['lime','sky','lilac','peach'][S.groups.length % 4]}, base:0, likes:[], spots:[], members:[S.me], goal:{n:Number(n), per}, lastPlan:iso(TODAY), invite:'plancito.app/u/' + id, regalitoOn:false, plans:[], history:[]});
    UI.gid = id; UI.view = 'group'; UI.tab = 'plancitos'; UI.modal = 'invite'; commit(); },
  join: () => toast(val('joinLink').trim() ? 'En la app real te sumaría al grupo' : 'Pegá el link que te pasaron'),
  idea: d => { UI.idea = d.v; render(); },
  delPhoto: () => { delete G(UI.gid).photo; commit(); },
  stampIcon: d => { const g = G(UI.gid); g.stamp = {...(g.stamp || {color:'tomato'}), icon:d.v}; commit(); },
  stampColor: d => { const g = G(UI.gid); g.stamp = {...(g.stamp || {icon:'taza'}), color:d.v}; commit(); },
  like: d => { const g = G(UI.gid); g.likes = g.likes || []; const i = g.likes.indexOf(d.v); i > -1 ? g.likes.splice(i,1) : g.likes.push(d.v); commit(); },
  addSpot: () => { const g = G(UI.gid), n = val('spotName').trim(); if (!n){ toast('Poné el nombre del lugar'); return; } g.spots = g.spots || []; g.spots.push({name:n, type:val('spotType')}); toast(`${n} quedó como lugar de siempre`); commit(); },
  delSpot: d => { G(UI.gid).spots.splice(Number(d.v), 1); commit(); },
  tpl: d => { me().av = {...TEMPLATES[Number(d.v)]}; commit(); },
  avTab: d => { UI.avTab = d.v; render(); },
  av: d => { if (isLocked(UI.avTab, d.v)){ const n = needFor(UI.avTab, d.v); toast(`Se desbloquea con ${n} ★. Te faltan ${n - myPoints()}.`); return; } me().av[UI.avTab] = d.v; commit(); },
  zstyle: d => { if (isLocked('z', d.v)){ const n = needFor('z', d.v); toast(`Se desbloquea con ${n} ★. Te faltan ${n - myPoints()}.`); return; } me().zumbido.style = d.v; save(); render(); playBuzz(S.me, null, d.v, me().zumbido.msg, 'preview'); },
  zPreview: () => playBuzz(S.me, null, me().zumbido.style, me().zumbido.msg, 'preview'),
  buzz: d => { const g = G(d.g || UI.gid), now = Date.now(); UI.buzzAt = UI.buzzAt || {};
    if (UI.buzzAt[g.id] && now - UI.buzzAt[g.id] < 15000){ toast('No podés mandar zumbidos con tanta frecuencia.'); return; }
    UI.buzzAt[g.id] = now; if (d.v !== undefined && S.inbox) S.inbox.splice(Number(d.v), 1);
    const z = me().zumbido; playBuzz(S.me, g, z.style, z.msg, 'sent');
    g.buzzPts = g.buzzPts || {}; if (g.buzzPts[S.me] !== iso(TODAY)){ g.buzzPts[S.me] = iso(TODAY); addPoints(S.me, 'zumbido', g.id); UI.fxDelay = 3300; }
    save(); render(); },
  seeBuzz: d => { UI.modal = null; render(); const z = S.inbox[Number(d.v)]; playBuzz(z.from, G(z.gid), S.people[z.from].zumbido.style, S.people[z.from].zumbido.msg, 'got'); },
  fxClose: () => document.querySelectorAll('.fx-ov').forEach(o => o.remove()),
  tryUnlock: d => { document.querySelectorAll('.fx-ov').forEach(o => o.remove()); if (d.k === 'z') me().zumbido.style = d.v; else me().av[d.k] = d.v; save(); UI.avTab = d.k === 'z' ? UI.avTab : d.k; go('profile'); },
  addWish: () => { const t = val('wishIn').trim(); if (!t) return; me().wishlist.push(t); commit(); },
  delWish: d => { me().wishlist.splice(Number(d.v),1); commit(); },
  reset: () => { try { localStorage.removeItem(KEY); } catch(e) {} S = seed(); UI = { view:'home', gid:null, pid:null, tab:'plancitos', modal:null, avTab:'pelo', prop:null, challenge:false }; render(); toast('Demo reiniciada'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A') return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a === 'closeBg' && el !== e.target) return;
  e.preventDefault();
  fn({...el.dataset, g:el.dataset.g, p:el.dataset.p, o:el.dataset.o}, e);
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f){ me()[f] = e.target.value; save(); if (f === 'nick') render(); }
  const c = e.target.dataset && e.target.dataset.c;
  if (c){ me().askContact = {...(me().askContact || {}), [c]: e.target.value}; save(); }
  if (e.target.id === 'usdRate'){ const g = G(UI.gid); g.usdRate = Number(e.target.value.replace(/[^\d]/g,'')) || 1450; save(); render(); }
  if (e.target.id === 'prizeIn'){ G(UI.gid).prize = e.target.value.trim(); save(); render(); }
  if (e.target.id === 'groupPhoto' && e.target.files && e.target.files[0]){
    const f = e.target.files[0], rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 320 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      G(UI.gid).photo = c.toDataURL('image/jpeg', .82); save(); render(); toast('Foto del grupo actualizada'); }; im.src = rd.result; };
    rd.readAsDataURL(f); }
  if (e.target.id === 'zMsg'){ me().zumbido.msg = e.target.value.trim(); save(); }
  if (e.target.id === 'zSound'){ me().zumbido.sound = e.target.checked; save(); }
  if (e.target.id === 'pfBdayOn'){ me().bdayOn = e.target.checked; save(); }
});
render();
